name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mingc/android-build-box:latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install
      working-directory: arv-complete/arv-dapp-pro-clean

    - name: Build Next.js Project
      run: npm run build
      working-directory: arv-complete/arv-dapp-pro-clean
      env:
        isMobileBuild: 'true'

    - name: Sync Capacitor
      run: npx cap sync android
      working-directory: arv-complete/arv-dapp-pro-clean

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
      working-directory: arv-complete/arv-dapp-pro-clean

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: arv-complete/arv-dapp-pro-clean/android/app/build/outputs/apk/debug/app-debug.apk
